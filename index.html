<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Missionary Hours</title>
  <style>
    :root{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      line-height:1.35;
      color:#111;
    }
    body{ margin:0; padding:20px; background:#f7f7f7; }
    .card{
      max-width:720px;
      margin:0 auto;
      background:#fff;
      border:1px solid #e6e6e6;
      border-radius:16px;
      padding:18px;
      box-shadow:0 1px 8px rgba(0,0,0,.05);
    }
    h1{ margin:0 0 8px; font-size:20px; font-weight:700; }
    p.sub{ margin:0 0 16px; font-size:13px; color:#444; }
    label{ display:block; margin:12px 0 6px; font-size:13px; font-weight:650; color:#333; }
    select,input{
      width:100%;
      box-sizing:border-box;
      padding:11px 12px;
      font-size:14px;
      border-radius:12px;
      border:1px solid #d7d7d7;
      background:#fff;
      outline:none;
    }
    input:focus,select:focus{
      border-color:#b9b9b9;
      box-shadow:0 0 0 3px rgba(0,0,0,.06);
    }
    .row{ display:grid; grid-template-columns:1fr; gap:10px; }
    @media(min-width:720px){ .row.two{ grid-template-columns:1fr 1fr; } }
    .btnrow{ margin-top:14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    button{
      appearance:none; border:0; border-radius:12px;
      padding:11px 14px; font-size:14px; font-weight:700;
      cursor:pointer; background:#111; color:#fff;
    }
    button[disabled]{ opacity:.55; cursor:not-allowed; }
    .status{
      margin-top:12px; padding:10px 12px; border-radius:12px;
      border:1px solid #ededed; background:#fcfcfc;
      display:none; font-size:13px; color:#333;
    }
    .status.ok{ border-color:#cfe8d4; background:#f2fbf4; }
    .status.ok .total{ margin-top:6px; font-size:15px; font-weight:700; color:#1a6b35; }
    .status.err{ border-color:#f2c9c9; background:#fff5f5; }
    .tiny{ margin-top:10px; font-size:12px; color:#666; }
    .req{ color:#b00020; }
  </style>
</head>
<body>
<div class="card">
  <h1>Missionary Hours</h1>
  <p class="sub">Enter your hours for the month. Submission time is recorded automatically.</p>
  <form id="hoursForm">
    <div class="row two">
      <div>
        <label for="month"><span class="req">*</span> Month</label>
        <select id="month" name="month" required>
          <option value="">— Select month —</option>
        </select>
      </div>
      <div>
        <label for="hours"><span class="req">*</span> Hours</label>
        <input
          id="hours" name="hours"
          type="number" inputmode="decimal"
          min="0" step="0.25"
          placeholder="e.g., 12 or 12.5"
          required
        />
      </div>
    </div>

    <label for="name"><span class="req">*</span> Name</label>
    <input
      id="name" name="name"
      type="text"
      list="volunteers-list"
      autocomplete="off"
      placeholder="Start typing your name…"
      required
    />
    <datalist id="volunteers-list"></datalist>

    <input id="source" name="source" type="hidden" value="nfc" />

    <div class="btnrow">
      <button id="submitBtn" type="submit">Submit Hours</button>
    </div>
    <div id="status" class="status"></div>
    <div class="tiny">Tip: If you submit multiple times in a month, that's okay — monthly reporting will sum your entries.</div>
  </form>
</div>

<script>
  const SUPABASE_URL      = "https://tfkdkekvtuqepjqsgjoc.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_JRFxF6A8mDcZX2D05CdoCQ_F6_rDbwh";
  const headers = {
    "apikey":        SUPABASE_ANON_KEY,
    "Authorization": "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type":  "application/json"
  };

  // ── Month dropdown ───────────────────────────────────────
  const MONTH_NAMES = ["January","February","March","April","May","June",
                       "July","August","September","October","November","December"];
  function monthLabelFromValue(yyyyMM){
    const [y,m] = yyyyMM.split("-");
    return MONTH_NAMES[parseInt(m,10)-1] + " " + y;
  }
  (function buildMonths(){
    const sel = document.getElementById("month");
    const now = new Date();
    const cur = now.getFullYear() + "-" + String(now.getMonth()+1).padStart(2,"0");
    for(let delta=-2; delta<=18; delta++){
      const d  = new Date(now.getFullYear(), now.getMonth()+delta, 1);
      const v  = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      const o  = document.createElement("option");
      o.value  = v;
      o.textContent = MONTH_NAMES[d.getMonth()] + " " + d.getFullYear();
      if(v === cur) o.selected = true;
      sel.appendChild(o);
    }
  })();

  // ── Load volunteer names into datalist ──────────────────
  async function loadVolunteers(){
    try {
      const res = await fetch(
        SUPABASE_URL + "/rest/v1/volunteers" +
        "?select=full_name" +
        "&missionary_type=not.is.null" +
        "&order=full_name.asc",
        { headers }
      );
      if(!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      const dl = document.getElementById("volunteers-list");
      dl.innerHTML = "";
      data.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.full_name;
        dl.appendChild(opt);
      });
    } catch(err){
      console.error("loadVolunteers:", err);
    }
  }
  loadVolunteers();

  // ── Status helpers ───────────────────────────────────────
  const statusBox = document.getElementById("status");
  function setStatus(kind, html){
    statusBox.className    = "status " + (kind||"");
    statusBox.innerHTML    = html;
    statusBox.style.display = "block";
  }
  function clearStatus(){
    statusBox.style.display = "none";
    statusBox.innerHTML = "";
    statusBox.className = "status";
  }

  // ── Submit ───────────────────────────────────────────────
  document.getElementById("hoursForm").addEventListener("submit", async e => {
    e.preventDefault();
    clearStatus();

    const month  = document.getElementById("month").value;
    const hours  = parseFloat(document.getElementById("hours").value);
    const name   = document.getElementById("name").value.trim();
    const source = "nfc";

    if(!month)                             { setStatus("err","Please select a month."); return; }
    if(!name)                              { setStatus("err","Please enter your name."); return; }
    if(!Number.isFinite(hours)||hours<=0)  { setStatus("err","Please enter a valid number of hours greater than zero."); return; }

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Submitting…";

    try {
      const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/log_missionary_hours", {
        method:"POST", headers,
        body: JSON.stringify({ p_name:name, p_hours:hours, p_month:month, p_source:source })
      });
      const data = await res.json();

      if(!res.ok || data?.status === "error"){
        const msg  = data?.message || ("HTTP " + res.status);
        const hint = data?.hint    ? "<br><small>" + data.hint + "</small>" : "";
        setStatus("err", "Could not save hours: " + msg + hint);
        return;
      }

      const label = monthLabelFromValue(data.month || month);
      const total = parseFloat(data.total_hours || 0);
      setStatus("ok",
        "Hours saved for " + label + "." +
        "<div class='total'>Your total for " + label + ": " +
        total.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}) +
        " hours</div>"
      );
      document.getElementById("hours").value = "";

    } catch(err){
      setStatus("err","Network error — please try again.<br><small>" + (err?.message||String(err)) + "</small>");
    } finally {
      btn.disabled = false;
      btn.textContent = "Submit Hours";
    }
  });
</script>
</body>
</html>
